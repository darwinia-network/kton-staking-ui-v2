name: Check pull request

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-code:
    name: Check code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint script
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Test build
        run: pnpm build

      - name: Notify GitHub Pages repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_PAGES_DISPATCH_TOKEN: ${{ secrets.KTON_GITHUB_PAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GITHUB_PAGES_DISPATCH_TOKEN}" ]; then
            echo "::warning title=GitHub Pages dispatch skipped::KTON_GITHUB_PAGES_DISPATCH_TOKEN is not configured"
            exit 0
          fi

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_PAGES_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ktondao/ktondao.github.io/dispatches \
            --data "$(jq -nc \
              --arg event_type "kton-staking-updated" \
              --arg source_repository "${GITHUB_REPOSITORY}" \
              --arg source_ref "${GITHUB_REF_NAME}" \
              --arg source_sha "${GITHUB_SHA}" \
              '{event_type: $event_type, client_payload: {source_repository: $source_repository, source_ref: $source_ref, source_sha: $source_sha}}')"

